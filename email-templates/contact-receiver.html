<!--
  EmailJS — RECEIVER (you get this when someone submits the form)
  Subject:  New portfolio message from {{from_name}}
  To:       gaurangp830@gmail.com
  Reply-To: {{reply_to}}

  Variables: {{to_name}} {{from_name}} {{from_email}} {{reply_to}} {{message}} {{site_url}}
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New portfolio enquiry</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f6fb;font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color:#f4f6fb;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:560px;">
            <tr>
              <td style="border-radius:16px 16px 0 0;overflow:hidden;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="background:linear-gradient(120deg,#4f46e5,#6366f1,#818cf8);padding:28px 32px;">
                      <p style="margin:0;font-family:'Sora',Georgia,serif;font-size:22px;font-weight:700;color:#fff;letter-spacing:-0.02em;">G<span style="color:#c7d2fe;">P</span>.</p>
                      <p style="margin:8px 0 0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;color:rgba(255,255,255,0.85);">Inbox · Contact form</p>
                      <h1 style="margin:20px 0 0;font-family:'Sora',Georgia,serif;font-size:20px;font-weight:700;color:#fff;line-height:1.35;">New message for {{to_name}}</h1>
                      <p style="margin:8px 0 0;font-size:14px;line-height:1.5;color:rgba(255,255,255,0.9);">A visitor submitted your portfolio contact form.</p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="background:#fff;border:1px solid #e8ecf4;border-top:none;border-radius:0 0 16px 16px;box-shadow:0 10px 40px -12px rgba(79,70,229,0.15);">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="padding:28px 32px 8px;">
                      <p style="margin:0 0 4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:#6366f1;">From</p>
                      <p style="margin:0;font-family:'Sora',Georgia,serif;font-size:18px;font-weight:700;color:#1e293b;">{{from_name}}</p>
                      <p style="margin:6px 0 0;font-size:14px;color:#64748b;"><a href="mailto:{{from_email}}" style="color:#4f46e5;text-decoration:none;font-weight:500;">{{from_email}}</a></p>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:16px 32px;">
                      <table role="presentation" width="100%" style="background:#f8fafc;border:1px solid #e8ecf4;border-radius:12px;">
                        <tr>
                          <td style="padding:18px 20px;">
                            <p style="margin:0 0 10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:#6366f1;">Message</p>
                            <p style="margin:0;font-size:15px;line-height:1.65;color:#334155;white-space:pre-wrap;">{{message}}</p>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:8px 32px 28px;" align="center">
                      <a href="mailto:{{reply_to}}?subject=Re%3A%20Portfolio%20enquiry" style="display:inline-block;padding:12px 28px;border-radius:999px;background:linear-gradient(120deg,#4f46e5,#818cf8);font-size:14px;font-weight:600;color:#fff;text-decoration:none;">Reply to {{from_name}}</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 8px;text-align:center;">
                <p style="margin:0;font-size:12px;color:#94a3b8;">Submitted via <a href="{{site_url}}" style="color:#6366f1;text-decoration:none;">{{site_url}}</a></p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
